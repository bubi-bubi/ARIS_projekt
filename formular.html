<!DOCTYPE html>
<html>
<head>
    <title>Formular Todesfälle</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" type="text/css">
</head>

<body>

    <header>
        <img id="picture" src="images/himmel.jpg" width="100%" height="auto">
    </header>   

    <div id="box1">
        <h1>Kanton Freiburg</h1>
        <a class="menuelist" href="index.html">Todesfälle anzeigen</a>
        <a class="visited" href="formular.html">Todesfälle eintragen</a>
    </div>

    <div id="wrapper">
        <form action="/cgi-bin/eintragen.sh" method="post">

            <div class="ef">
                <label for="todesdatum">Todesdatum:</label>
                <input id="todesdatum" name="todesdatum" type="date" required>
            </div>

            <div class="ef">
                <label for="f0_64">Frauen bis 64:</label>
                <input id="f0_64" name="f0_64" type="number" value="0" min="0" max="20">
            </div>

            <div class="ef">
                <label for="m0_64">Männer bis 64:</label>
                <input id="m0_64" name="m0_64" type="number" value="0" min="0" max="20">
            </div>

            <div class="ef">
                <label for="f65">Frauen ab 65:</label>
                <input id="f65" name="f65" type="number" value="0" min="0" max="20">
            </div>

            <div class="ef">
                <label for="m65">Männer ab 65:</label>
                <input id="m65" name="m65" type="number" value="0" min="0" max="20">
            </div>

            <button class="submit-btn" type="submit">Eintragen</button>

            <div id="box2" style="margin-top:10px;">
                <a href="/cgi-bin/neue_liste.sh">Neue Liste anzeigen</a>
            </div>

        </form>
    </div>

<footer>
    <p class="footer">
        Impressum<br>Team Eichörnli<br>Djamilja Shaila Heiniger, Nova Jost, Sonja Monika Mathis
    </p>
</footer>

</body>
</html>
