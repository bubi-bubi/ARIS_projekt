<!DOCTYPE html>
<html>
<head>
    <title>Formular Todesfälle</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" type="text/css">
</head>

<body>

    <header>
        <img id="picture" src="images/himmel.jpg" width="100%" height="auto">
    </header>   

    <div id="box1">
        <h1>Kanton Freiburg</h1>
        <a class="menuelist" href="index.html">Todesfälle anzeigen</a>
        <a class="visited" href="formular.html">Todesfälle eintragen</a>
    </div>

    <div id="wrapper">
        <form action="/cgi-bin/eintragen.sh" method="post">

            <div class="ef">
                <label class="label">Jahr:</label>
                <input class="input" type="number" name="jahr" min="1291"required>
            </div>
            
            <div class="ef">
                <label class="label">Monat:</label>
                <input class="input" type="number" name="monat" min="1" max="12" list="monate" required>
                <datalist id="monate">
                    <option value="1">
                    <option value="2">
                    <option value="3">
                    <option value="4">
                    <option value="5">
                    <option value="6">
                    <option value="7">
                    <option value="8">
                    <option value="9">
                    <option value="10">
                    <option value="11">
                    <option value="12">
                </datalist>
            </div>
            
            <div class="ef">
                <label class="label">Woche:</label>
                <input class="input" type="number" name="woche" min="1" max="52" list="monate" required>
                <datalist id="wochen">
                    <option value="1">
                    <option value="2">
                    <option value="3">
                    <option value="4">
                    <option value="5">
                    <option value="6">
                    <option value="7">
                    <option value="8">
                    <option value="9">
                    <option value="10">
                    <option value="11">
                    <option value="12">
                    <option value="13">
                    <option value="14">
                    <option value="15">
                    <option value="16">
                    <option value="17">
                    <option value="18">
                    <option value="19">
                    <option value="20">
                    <option value="21">
                    <option value="22">
                    <option value="23">
                    <option value="24">
                    <option value="25">
                    <option value="26">
                    <option value="27">
                    <option value="28">
                    <option value="29">
                    <option value="30">
                    <option value="31">
                    <option value="32">
                    <option value="33">
                    <option value="34">
                    <option value="35">
                    <option value="36">
                    <option value="37">
                    <option value="38">
                    <option value="39">
                    <option value="40">
                    <option value="41">
                    <option value="42">
                    <option value="43">
                    <option value="44">
                    <option value="45">
                    <option value="46">
                    <option value="47">
                    <option value="48">
                    <option value="49">
                    <option value="50">
                    <option value="51">
                    <option value="52">
                </datalist>
            </div>

            <div class="ef">
                <label for="f0_64">Frauen bis 64:</label>
                <input id="f0_64" name="f0_64" type="number" value="0" min="0" max="20">
            </div>

            <div class="ef">
                <label for="m0_64">Männer bis 64:</label>
                <input id="m0_64" name="m0_64" type="number" value="0" min="0" max="20">
            </div>

            <div class="ef">
                <label for="f65">Frauen ab 65:</label>
                <input id="f65" name="f65" type="number" value="0" min="0" max="20">
            </div>

            <div class="ef">
                <label for="m65">Männer ab 65:</label>
                <input id="m65" name="m65" type="number" value="0" min="0" max="20">
            </div>

            <button class="submit-btn" type="submit">Eintragen</button>

            <div id="box2" style="margin-top:10px;">
                <a href="/cgi-bin/neue_liste.sh">Neue Liste anzeigen</a>
            </div>

        </form>
    </div>

<footer>
    <p class="footer">
        Impressum<br>Team Eichörnli<br>Djamilja Shaila Heiniger, Nova Jost, Sonja Monika Mathis
    </p>
</footer>

</body>
</html>
