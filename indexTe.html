<!DOCTYPE html>
<html>

        <title> formular </title>
        <meta charset="utf8">
        <meta name="description" content="semesterprojekt für aris">
        <meta name="keywords" content="HTML, CSS, data, formular, forms, project">

    <body>
        <header> 
            <!--https://cdn.pixabay.com/photo/2013/06/30/11/19/switzerland-142372_1280.jpg-->
            <img id="picture" src="images/himmel.jpg" width="100%" height="auto">
        </header>

        <div id="box1">
                <a class="menuelist"  href="index.html">Hauptseite</a>
                <a class="visited" href="indexTe.html">Todesfälle eintragen</a>
        </div>
            

        <!-- label und input benötigen wir für unsere Formatierung, da wir versuchen wollen das ganze auch etwas hübsch zu haben-->
        <div id="wrapper">
            <form action="/cgi-bin/add_todesfaelle.sh" method="post">
        
                <h2>Todesfälle eintragen</h2>
        
                <div class="ef">
                    <label>Jahr:</label>
                    <input class="input" type="number" name="jahr" required>
                </div>
                
                <div class="ef">
                    <label>Monat:</label>
                    <input class="input" type="number" name="monat" required>
                </div>
                
                <div class="ef">
                    <label>Woche:</label>
                    <input class="input" type="number" name="woche" required>
                </div>
                
                <div class="ef">
                    <label>Wochenstart:</label>
                    <input class="input" type="date" name="wochenstart" required>
                </div>
                
                <div class="ef">
                    <!-- -999 ist notwenig um Tote wieder zu enfernen, falsch sie nicht Korrekt eingetragen wurden-->
                    <label>Frauen 0–64:</label>
                    <input class="input" type="number" name="f0_64" value="0" min="-999">
                </div>
                
                <div class="ef">    
                    <label>Frauen 65+:</label>
                    <input class="input" type="number" name="f65" value="0" min="65">
                </div>
                
                <div class="ef">
                    <label>Männer 0–64:</label>
                    <input class="input" type="number" name="m0_64" value="0" min="-999">
                </div>
                
                <div class="ef">
                    <label>Männer 65+:</label>
                    <input class="input" type="number" name="m65" value="0" min="-999">
                </div>
        
                <button class="submit-btn" type="submit">Eintragen</button>
            </form>
        </div>

        <footer>
            <p class="footer">
                Impressum<br>Team Eichörnli<br>Djamilja Shaila Heiniger, Nova Jost, Sonja Monika Mathis</p>    
        </footer> 
    
    </body>

</html>
